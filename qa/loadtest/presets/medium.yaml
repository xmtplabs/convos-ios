    textShort: 45
    textMedium: 22
    textLong: 5
    emojiOnly: 10
    link: 8
    reply: 5
    reaction: 5
    attachmentImage: 0
    attachmentVideo: 0
  longTextMaxChars: 49000
  rate:
    perGroupMsgsPerSec: 2
    globalMsgsPerSec: 5
    jitter: 0.4

churn:
  durationMin: 0

measurement:
  cxdb: true
  runLabel: medium
