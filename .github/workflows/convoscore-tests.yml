name: ConvosCore Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: warp-macos-26-arm64-12x
    # Generous enough to survive a cold SwiftPM fetch: the libxmtp clone
    # alone has been observed at 44 minutes under GitHub throttling, and a
    # timeout kill also skips the cache save that would spare the next run.
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show environment
        run: |
          swift --version
          xcodebuild -version

      # Cache only SwiftPM's repository/artifact cache, not .build: the bare
      # git mirrors (libxmtp's full clone is the expensive part, 92s-2650s
      # observed) and downloaded binary artifacts are what make a run fast,
      # while .build products pushed entries to 6-8GB - blowing the repo's
      # 10GB cache quota and evicting every other cache within hours.
      - name: Restore Swift Package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ConvosCore/Package.resolved', 'ConvosAppData/Package.resolved', 'ConvosInvites/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run unit tests
        run: ./ci/run-tests.sh --unit

      # Save only from dev: caches saved during pull_request runs land on
      # refs/pull/N/merge, which no other PR can restore - they just evict
      # the shared entry. One dev-scoped cache is inherited by every PR.
      - name: Save Swift Package cache
        if: always() && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ConvosCore/Package.resolved', 'ConvosAppData/Package.resolved', 'ConvosInvites/Package.resolved') }}

      - name: Upload unit test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: ci-test-logs/
          retention-days: 7
          if-no-files-found: ignore

  deploy-backend:
    name: Deploy XMTP Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      xmtp_node_address: ${{ steps.deploy.outputs.xmtp_node_address }}
      app_name: ${{ steps.deploy.outputs.app_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.60

      - name: Deploy ephemeral backend
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="convos-ios-test-${{ github.run_id }}-${{ github.run_attempt }}"
          ./ci/fly/deploy "$APP_NAME"

  integration-tests:
    name: Integration Tests
    runs-on: warp-macos-26-arm64-12x
    needs: deploy-backend
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show environment
        run: |
          swift --version
          xcodebuild -version

      # Same path and key as the unit job so both restore the one dev-saved
      # entry (they previously hashed different Package.resolved sets, so
      # each job stored its own multi-GB cache). Restore-only: dev's unit
      # job owns the save.
      - name: Restore Swift Package cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ConvosCore/Package.resolved', 'ConvosAppData/Package.resolved', 'ConvosInvites/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run integration tests
        env:
          XMTP_NODE_ADDRESS: ${{ needs.deploy-backend.outputs.xmtp_node_address }}
          CONVOS_TEST_XMTP_LOG_LEVEL: debug
          CONVOS_TEST_XMTP_LOG_DIR: ${{ github.workspace }}/xmtp-test-logs
        run: ./ci/run-tests.sh --integration

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            ci-test-logs/
            ConvosCore/.build/debug/*.log
            xmtp-test-logs/
          retention-days: 7
          if-no-files-found: ignore

  cleanup:
    name: Cleanup Backend
    runs-on: ubuntu-latest
    needs: [deploy-backend, integration-tests]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.60

      - name: Destroy ephemeral app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME="${{ needs.deploy-backend.outputs.app_name }}"
          if [[ -n "$APP_NAME" ]]; then
            echo "Destroying app: $APP_NAME"
            flyctl apps destroy "$APP_NAME" --yes || echo "Warning: Failed to destroy app (may already be deleted)"
          else
            echo "No app name found, skipping cleanup"
          fi
